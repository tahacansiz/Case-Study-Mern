name: MERN Kubernetes CI/CD

on:
  push:
    branches:
      - master

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mern-project/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Build Frontend Docker Image
        run: docker build -t mern-frontend:latest .

  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mern-project/server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: npm install

      - name: Build Backend Docker Image
        run: docker build -t mern-backend:latest .
