name: Python ETL Pipeline

on:
  push:
    branches:
      - master

    paths:
      - 'python-project/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      # Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Python Image
      - name: Build Python ETL Image
        run: |
          docker build -t tahacansiz/python-etl:latest ./python-project

      # Push Python Image
      - name: Push Python ETL Image
        run: |
          docker push tahacansiz/python-etl:latest

      # Deploy CronJob
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sudo k3s kubectl apply -f ~/k8s/python-namespace.yaml
            sudo k3s kubectl apply -f ~/k8s/python-cronjob.yaml
