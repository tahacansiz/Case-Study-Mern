name: MERN CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4

      # Docker Hub Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend Build
      - name: Build Backend Image
        run: |
          docker build -t tahacansiz/mern-backend:latest ./server

      # Backend Push
      - name: Push Backend Image
        run: |
          docker push tahacansiz/mern-backend:latest

      # Frontend Build
      - name: Build Frontend Image
        run: |
          docker build -t tahacansiz/mern-frontend:latest ./client

      # Frontend Push
      - name: Push Frontend Image
        run: |
          docker push tahacansiz/mern-frontend:latest

      # SSH Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sudo k3s kubectl rollout restart deployment backend -n mern-app
          
            sudo k3s kubectl rollout restart deployment frontend -n mern-app
          
            sudo k3s kubectl rollout status deployment backend -n mern-app
          
            sudo k3s kubectl rollout status deployment frontend -n mern-app
